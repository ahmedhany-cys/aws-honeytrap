name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, unit, integration & security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install -e .
      - name: Ruff
        run: ruff check backend lambda dashboard tests honeypot scripts
      - name: Pytest (unit + integration + security)
        run: >
          pytest tests/unit tests/integration tests/security
          --junitxml=pytest-junit.xml --cov --cov-report=term --cov-report=json:coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            pytest-junit.xml
            coverage.json

  terraform:
    name: Terraform fmt / validate / tflint / Checkov
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint --recursive --format compact
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkov
        run: |
          pip install checkov
          checkov -d . --framework terraform --quiet --compact --download-external-modules false

  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt -r requirements-honeypot.txt --strict --progress-spinner off

  honeypot:
    name: Build sensor image & run attack simulations
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install -e .
      - name: Start Cowrie (hardened container, loopback only)
        run: |
          mkdir -p honeypot/runtime/docker-var && chmod 0777 honeypot/runtime/docker-var
          docker compose up -d --build cowrie
          for i in $(seq 1 60); do nc -z 127.0.0.1 2222 && break; sleep 2; done
          docker inspect honeytrap-cowrie --format 'user={{.Config.User}} readonly={{.HostConfig.ReadonlyRootfs}} caps={{.HostConfig.CapDrop}}'
      - name: Run controlled attack simulations
        run: |
          python -m tests.simulations.runner \
            --log honeypot/runtime/docker-var/log/cowrie/cowrie.json \
            --store build/simulation --report build/simulation-results.json --settle 3
      - name: Verify blocked download attempts never produced a payload
        run: |
          grep -q '198.51.100.23' honeypot/runtime/docker-var/log/cowrie/cowrie.json
          ! grep -q '"cowrie.session.file_download".*198.51.100' honeypot/runtime/docker-var/log/cowrie/cowrie.json
      - name: Save image for deployment
        if: github.ref == 'refs/heads/main'
        run: |
          docker save honeytrap/cowrie:latest | gzip -9 > build/cowrie-image.tar.gz
          ls -lh build/cowrie-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-results
          path: build/simulation-results.json
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: cowrie-image-linux-amd64
          path: build/cowrie-image.tar.gz
          retention-days: 14
      - if: always()
        run: docker compose logs cowrie | tail -n 50; docker compose down
