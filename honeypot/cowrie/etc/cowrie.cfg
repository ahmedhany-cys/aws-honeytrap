# AWS HoneyTrap - Cowrie operator overlay.
# Only keys that differ from Cowrie's bundled cowrie.cfg.dist are set here.
# Any key can be overridden at runtime with COWRIE_<SECTION>_<KEY> environment variables.

[honeypot]
# Persona: Northwind Freight billing database server (fictional company).
hostname = nwf-db-prod-02
sensor_name = honeytrap-local
log_path = var/log/cowrie
state_path = var/lib/cowrie
download_path = ${honeypot:state_path}/downloads
# Never store more than 10 MiB per captured sample.
download_limit_size = 10485760
ttylog = true
ttylog_path = ${honeypot:state_path}/tty
idle_timeout = 180
authentication_timeout = 120
timezone = UTC
auth_class = UserDB

[shell]
# Custom decoy filesystem produced by honeypot/configuration/build_fs.py.
filesystem = etc/fs.pickle
arch = linux-x64-lsb
kernel_version = 6.1.0-21-amd64
kernel_build_string = #1 SMP PREEMPT_DYNAMIC Debian 6.1.90-1 (2024-05-03)
hardware_platform = x86_64
operating_system = GNU/Linux

[ssh]
enabled = true
version = SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u3
listen_endpoints = tcp:2222:interface=0.0.0.0
sftp_enabled = true
# Log direct-tcpip (port-forward) requests, but never open the onward connection:
# with forward_redirect and forward_tunnel disabled Cowrie only records the attempt.
forwarding = true
forward_redirect = false
forward_tunnel = false

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false
